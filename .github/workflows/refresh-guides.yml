name: Refresh guide copies

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Accept a fall of more than half of the product pages"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: refresh-guides

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the guide texts from the Hugging Face folder
        run: python3 tools/pull_guides.py
        env:
          ALLOW_DROP: ${{ inputs.allow_drop && '1' || '0' }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Refresh guide copies" && git push)
